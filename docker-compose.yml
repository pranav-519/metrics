version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: metricheck_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: metricheck_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metricheck_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/metricheck_db
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metricheck_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
